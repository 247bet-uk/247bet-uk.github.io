/* Screen profile: labels the page with the size class it opened at (data-screen), the orientation, short landscape screens
   and big system text, and updates when the phone rotates, the window resizes or the text size changes. The keyboard opening is ignored. */
(function () {
  var d = document.documentElement, lw = 0, lf = 0;
  function mq(q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } }
  function profile() {
    var w = window.innerWidth || d.clientWidth || 360, h = window.innerHeight || d.clientHeight || 640, f = parseFloat(getComputedStyle(d).fontSize) || 16;
    if (w === lw && f === lf) return;
    lw = w; lf = f;
    d.setAttribute("data-screen", w < 340 ? "xs" : w < 380 ? "sm" : w < 480 ? "md" : w < 768 ? "lg" : w < 1024 ? "tablet" : "desktop");
    d.setAttribute("data-orient", w > h ? "land" : "port");
    if (mq("(orientation: landscape) and (max-height: 520px)")) d.setAttribute("data-short", "1"); else d.removeAttribute("data-short");
    if (f > 17.5) d.setAttribute("data-bigtext", "1"); else d.removeAttribute("data-bigtext");
  }
  profile();
  window.addEventListener("resize", profile); window.addEventListener("orientationchange", profile); window.addEventListener("DOMContentLoaded", profile);
})();
</script>
